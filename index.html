<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wllpr — Minimalist Wallpaper Generator</title>
<meta name="description" content="Generate beautiful minimalist wallpapers. 4K desktop & mobile, light & dark, custom palettes. Free, no account, 100% in your browser.">
<style>
:root {
  --bg: #fafafa; --surface: #ffffff; --text: #111111; --muted: #888888;
  --border: #e8e8e8; --accent: #111111; --radius: 12px;
}
[data-theme="dark"] {
  --bg: #0d0d0d; --surface: #161616; --text: #f0f0f0; --muted: #777777;
  --border: #262626; --accent: #f0f0f0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; transition: background 0.2s, color 0.2s;
}
.wrap { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }

/* Nav */
.nav {
  display: flex; justify-content: space-between; align-items: center;
  padding: 1rem 0; margin-bottom: 1rem;
}
.brand { font-weight: 800; font-size: 1.3rem; letter-spacing: -0.02em; }
.brand span { font-weight: 400; color: var(--muted); }
.nav-actions { display: flex; gap: 0.5rem; align-items: center; }
.icon-btn {
  background: transparent; border: 1px solid var(--border); border-radius: 8px;
  width: 36px; height: 36px; cursor: pointer; font-size: 1rem;
  display: flex; align-items: center; justify-content: center; color: var(--text);
}
.icon-btn:hover { border-color: var(--text); }
.lang-btn {
  background: transparent; border: 1px solid var(--border); border-radius: 8px;
  padding: 0 10px; height: 36px; cursor: pointer;
  font-size: 0.75rem; font-weight: 700; color: var(--muted);
}
.lang-btn:hover { color: var(--text); border-color: var(--text); }

/* Layout */
.main { display: grid; grid-template-columns: 320px 1fr; gap: 1.5rem; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: 1fr; } }

/* Controls */
.panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.25rem;
  position: sticky; top: 1rem;
}
.panel h3 {
  font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--muted); margin: 1.25rem 0 0.6rem; font-weight: 700;
}
.panel h3:first-child { margin-top: 0; }
.pattern-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
.pattern-btn {
  border: 1px solid var(--border); background: var(--bg); border-radius: 10px;
  padding: 0.6rem 0.3rem; cursor: pointer; font-size: 0.75rem; color: var(--text);
  display: flex; flex-direction: column; align-items: center; gap: 0.3rem;
  transition: border-color 0.15s, transform 0.15s;
}
.pattern-btn .p-icon { font-size: 1.3rem; }
.pattern-btn:hover { border-color: var(--text); }
.pattern-btn.active { border-color: var(--text); border-width: 2px; background: var(--surface); }

.palette-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
.palette-btn {
  border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
  cursor: pointer; padding: 0; background: none; transition: transform 0.15s;
}
.palette-btn:hover { transform: translateY(-2px); }
.palette-btn.active { outline: 2px solid var(--text); outline-offset: 2px; }
.palette-sw { display: flex; height: 36px; }
.palette-sw div { flex: 1; }
.palette-name { font-size: 0.65rem; padding: 0.3rem; color: var(--muted); text-align: center; }

.row { display: flex; gap: 0.5rem; align-items: center; }
select, input[type="color"] {
  border: 1px solid var(--border); border-radius: 8px; background: var(--bg);
  color: var(--text); padding: 0.5rem; font-size: 0.85rem; cursor: pointer;
}
select { flex: 1; }
input[type="color"] { width: 44px; height: 38px; padding: 2px; }
.mode-toggle { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; flex: 1; }
.mode-toggle button {
  flex: 1; border: none; background: transparent; color: var(--muted);
  padding: 0.55rem; cursor: pointer; font-size: 0.85rem; font-weight: 600;
}
.mode-toggle button.active { background: var(--text); color: var(--bg); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
  border: none; border-radius: 10px; padding: 0.85rem 1.25rem;
  font-size: 0.95rem; font-weight: 700; cursor: pointer; width: 100%;
  transition: opacity 0.15s, transform 0.1s;
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--text); color: var(--bg); margin-top: 1.25rem; }
.btn-primary:hover { opacity: 0.88; }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); margin-top: 0.5rem; }
.btn-ghost:hover { border-color: var(--text); }

/* Preview */
.preview-wrap {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.5rem;
  display: flex; flex-direction: column; align-items: center;
}
.canvas-holder {
  width: 100%; display: flex; justify-content: center; align-items: center;
  background: var(--bg); border-radius: 8px; padding: 1rem;
  min-height: 300px;
}
canvas#wp {
  max-width: 100%; max-height: 62vh; border-radius: 6px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.18);
}
.meta {
  margin-top: 1rem; font-size: 0.8rem; color: var(--muted);
  display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center;
}
.meta b { color: var(--text); font-weight: 600; }

/* Footer */
footer {
  margin-top: 3rem; padding: 1.5rem 0; border-top: 1px solid var(--border);
  text-align: center; font-size: 0.8rem; color: var(--muted);
}
footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">

  <nav class="nav">
    <div class="brand">wllpr <span>· minimalist wallpapers</span></div>
    <div class="nav-actions">
      <button class="lang-btn" id="langBtn">EN</button>
      <button class="icon-btn" id="themeBtn" title="Toggle theme">🌙</button>
    </div>
  </nav>

  <div class="main">
    <aside class="panel">
      <h3 data-i18n="pattern">Pattern</h3>
      <div class="pattern-grid" id="patternGrid"></div>

      <h3 data-i18n="palette">Palette</h3>
      <div class="palette-grid" id="paletteGrid"></div>
      <div class="row" style="margin-top:0.6rem">
        <input type="color" id="c1" value="#e8e4de" title="Color 1">
        <input type="color" id="c2" value="#1a1a2e" title="Color 2">
        <input type="color" id="c3" value="#e94560" title="Color 3">
        <button class="btn btn-ghost" id="customBtn" style="margin:0;flex:1;padding:0.55rem" data-i18n="use_custom">Use custom</button>
      </div>

      <h3 data-i18n="mode">Mode</h3>
      <div class="mode-toggle">
        <button id="modeLight" class="active">☀️ <span data-i18n="light">Light</span></button>
        <button id="modeDark">🌙 <span data-i18n="dark">Dark</span></button>
      </div>

      <h3 data-i18n="size">Size</h3>
      <select id="sizeSel">
        <option value="3840x2160">Desktop 4K — 3840 × 2160</option>
        <option value="2560x1440">Desktop QHD — 2560 × 1440</option>
        <option value="1920x1080" selected>Desktop HD — 1920 × 1080</option>
        <option value="1290x2796">iPhone — 1290 × 2796</option>
        <option value="1080x1920">Mobile — 1080 × 1920</option>
        <option value="1080x1080">Square — 1080 × 1080</option>
      </select>

      <button class="btn btn-ghost" id="shuffleBtn">🎲 <span data-i18n="shuffle">Shuffle</span></button>
      <button class="btn btn-primary" id="dlBtn">⬇ <span data-i18n="download">Download PNG</span></button>
    </aside>

    <div class="preview-wrap">
      <div class="canvas-holder">
        <canvas id="wp" width="1920" height="1080"></canvas>
      </div>
      <div class="meta">
        <span><b id="mPattern">Waves</b></span>
        <span id="mSize">1920 × 1080</span>
        <span id="mPalette">Porcelain</span>
      </div>
    </div>
  </div>

  <footer>
    <span data-i18n="footer">Free forever · No account · 100% in your browser</span> — wllpr by <a href="https://chospace.github.io">chospace</a>
  </footer>
</div>

<script>
// ================= PALETTES =================
// each palette: { name, light: [bg, c1, c2, c3], dark: [bg, c1, c2, c3] }
const PALETTES = [
  { name: 'Porcelain', light: ['#f4f1ec', '#d8d2c4', '#a8a094', '#5c5648'], dark: ['#14120f', '#2e2a24', '#5c5648', '#d8d2c4'] },
  { name: 'Midnight', light: ['#eef1f6', '#c3cede', '#7d8fb0', '#2e3d5c'], dark: ['#0b0e14', '#1a2233', '#2e3d5c', '#7d8fb0'] },
  { name: 'Sage', light: ['#f2f4ef', '#d4dcc9', '#9caf88', '#4a5d3a'], dark: ['#11140f', '#232a1e', '#4a5d3a', '#9caf88'] },
  { name: 'Terracotta', light: ['#faf3ec', '#ecd9c3', '#d08c60', '#8c4a2f'], dark: ['#17100b', '#2e1f14', '#8c4a2f', '#d08c60'] },
  { name: 'Mono', light: ['#ffffff', '#d4d4d4', '#888888', '#222222'], dark: ['#000000', '#2a2a2a', '#777777', '#e0e0e0'] },
  { name: 'Ocean', light: ['#eef6f7', '#bcd9de', '#5b9aa8', '#1d5c6b'], dark: ['#081114', '#14262b', '#1d5c6b', '#5b9aa8'] },
  { name: 'Blush', light: ['#faf0f2', '#f0cdd6', '#d98aa0', '#8c3a54'], dark: ['#150b0e', '#2b161c', '#8c3a54', '#d98aa0'] },
  { name: 'Moss', light: ['#f4f5ee', '#dfe3cf', '#a3b183', '#5a6b3f'], dark: ['#101208', '#20240f', '#5a6b3f', '#a3b183'] },
];

const PATTERNS = [
  { id: 'waves', icon: '〰️', name: { id: 'Waves', en: 'Waves' } },
  { id: 'arcs', icon: '◎', name: { id: 'Arcs', en: 'Arcs' } },
  { id: 'hills', icon: '⛰️', name: { id: 'Hills', en: 'Hills' } },
  { id: 'gradient', icon: '🌅', name: { id: 'Gradient', en: 'Gradient' } },
  { id: 'dots', icon: '⚫', name: { id: 'Dots', en: 'Dots' } },
  { id: 'mesh', icon: '🎨', name: { id: 'Mesh', en: 'Mesh' } },
];

const SIZES = {
  '3840x2160': [3840, 2160], '2560x1440': [2560, 1440], '1920x1080': [1920, 1080],
  '1290x2796': [1290, 2796], '1080x1920': [1080, 1920], '1080x1080': [1080, 1080],
};

// ================= I18N =================
const I18N = {
  id: { pattern: 'Pola', palette: 'Palet', mode: 'Mode', size: 'Ukuran', light: 'Terang', dark: 'Gelap',
        use_custom: 'Pakai custom', shuffle: 'Acak', download: 'Unduh PNG',
        footer: 'Gratis selamanya · Tanpa akun · 100% di browser' },
  en: { pattern: 'Pattern', palette: 'Palette', mode: 'Mode', size: 'Size', light: 'Light', dark: 'Dark',
        use_custom: 'Use custom', shuffle: 'Shuffle', download: 'Download PNG',
        footer: 'Free forever · No account · 100% in your browser' },
};
let lang = localStorage.getItem('wllpr-lang') || 'id';
function applyLang() {
  const t = I18N[lang];
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if (t[k]) el.textContent = t[k];
  });
  document.getElementById('langBtn').textContent = lang === 'id' ? 'EN' : 'ID';
  document.documentElement.lang = lang;
  renderPatternGrid();
}

// ================= STATE =================
let state = {
  pattern: 'waves',
  paletteIdx: 0,
  mode: 'light',
  size: '1920x1080',
  custom: null,
  seed: Math.floor(Math.random() * 1e9),
};

// seeded RNG (mulberry32)
function rng(seed) {
  let a = seed >>> 0;
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function currentColors() {
  if (state.custom) return state.custom;
  const p = PALETTES[state.paletteIdx];
  return p[state.mode];
}

// ================= RENDERERS =================
function render() {
  const [W, H] = SIZES[state.size];
  const cv = document.getElementById('wp');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const colors = currentColors();
  const R = rng(state.seed);
  const fn = { waves: drawWaves, arcs: drawArcs, hills: drawHills, gradient: drawGradient, dots: drawDots, mesh: drawMesh }[state.pattern];
  fn(ctx, W, H, colors, R);
  // meta
  const pName = PATTERNS.find(p => p.id === state.pattern).name[lang] || PATTERNS.find(p => p.id === state.pattern).name.en;
  document.getElementById('mPattern').textContent = pName;
  document.getElementById('mSize').textContent = W + ' × ' + H;
  document.getElementById('mPalette').textContent = state.custom ? (lang === 'id' ? 'Custom' : 'Custom') : PALETTES[state.paletteIdx].name;
}

function drawWaves(ctx, W, H, c, R) {
  ctx.fillStyle = c[0]; ctx.fillRect(0, 0, W, H);
  const layers = 4 + Math.floor(R() * 3);
  const ampBase = H * (0.06 + R() * 0.08);
  const yBase = H * (0.3 + R() * 0.4);
  const phase = R() * Math.PI * 2;
  for (let i = 0; i < layers; i++) {
    const yOff = yBase + (i - layers / 2) * H * 0.09;
    const amp = ampBase * (0.7 + R() * 0.6);
    const freq = (1.2 + R() * 1.8) * Math.PI * 2 / W;
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 8) {
      const y = yOff + Math.sin(x * freq + phase + i * 0.7) * amp;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H); ctx.closePath();
    ctx.fillStyle = c[1 + (i % 3)];
    ctx.globalAlpha = 0.55 + (i / layers) * 0.45;
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawArcs(ctx, W, H, c, R) {
  ctx.fillStyle = c[0]; ctx.fillRect(0, 0, W, H);
  const cx = W * (0.2 + R() * 0.6), cy = H * (0.2 + R() * 0.6);
  const maxR = Math.hypot(W, H) * 0.75;
  const rings = 5 + Math.floor(R() * 5);
  const lw = Math.max(2, W / 400);
  for (let i = rings; i > 0; i--) {
    const r = (i / rings) * maxR * (0.85 + R() * 0.15);
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.lineWidth = lw * (0.6 + R() * 1.4);
    ctx.strokeStyle = c[1 + (i % 3)];
    ctx.globalAlpha = 0.25 + (1 - i / rings) * 0.65;
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // solid center dot
  ctx.beginPath(); ctx.arc(cx, cy, lw * 3, 0, Math.PI * 2);
  ctx.fillStyle = c[3]; ctx.fill();
}

function drawHills(ctx, W, H, c, R) {
  ctx.fillStyle = c[0]; ctx.fillRect(0, 0, W, H);
  // subtle sky gradient
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, c[0]); g.addColorStop(1, c[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const layers = 3 + Math.floor(R() * 3);
  for (let i = 0; i < layers; i++) {
    const yBase = H * (0.35 + (i / layers) * 0.55);
    ctx.beginPath(); ctx.moveTo(0, H);
    const peaks = 2 + Math.floor(R() * 3);
    let x = 0;
    ctx.lineTo(0, yBase + (R() - 0.5) * H * 0.1);
    for (let p = 0; p < peaks; p++) {
      const px = (p + 0.5 + R() * 0.4) / peaks * W;
      const py = yBase - R() * H * 0.22;
      const nx = (p + 1) / peaks * W;
      const ny = yBase + (R() - 0.5) * H * 0.08;
      ctx.quadraticCurveTo(px, py, nx, ny);
    }
    ctx.lineTo(W, H); ctx.closePath();
    ctx.fillStyle = c[1 + (i % 3)];
    ctx.globalAlpha = 0.5 + (i / layers) * 0.5;
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  // sun/moon
  const sx = W * (0.15 + R() * 0.7), sy = H * (0.12 + R() * 0.2);
  const sr = Math.min(W, H) * (0.04 + R() * 0.03);
  ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2);
  ctx.fillStyle = c[3]; ctx.globalAlpha = 0.9; ctx.fill(); ctx.globalAlpha = 1;
}

function drawGradient(ctx, W, H, c, R) {
  const angle = R() * Math.PI * 2;
  const x1 = W / 2 - Math.cos(angle) * W / 2, y1 = H / 2 - Math.sin(angle) * H / 2;
  const x2 = W / 2 + Math.cos(angle) * W / 2, y2 = H / 2 + Math.sin(angle) * H / 2;
  const g = ctx.createLinearGradient(x1, y1, x2, y2);
  const stops = [c[0], c[1], c[2], c[0]];
  const n = 2 + Math.floor(R() * 2);
  for (let i = 0; i <= n; i++) g.addColorStop(i / n, stops[i % stops.length]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // soft vignette
  const v = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.3, W/2, H/2, Math.hypot(W,H)*0.7);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.12)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

function drawDots(ctx, W, H, c, R) {
  ctx.fillStyle = c[0]; ctx.fillRect(0, 0, W, H);
  const cols = 12 + Math.floor(R() * 10), rows = Math.round(cols * H / W);
  const dx = W / cols, dy = H / rows;
  const maxR = Math.min(dx, dy) * 0.42;
  for (let i = 0; i < cols; i++) {
    for (let j = 0; j < rows; j++) {
      // wave-based size variation for organic feel
      const wave = 0.5 + 0.5 * Math.sin(i * 0.5 + R() * 0 + j * 0.35);
      const r = maxR * (0.25 + wave * 0.75);
      ctx.beginPath();
      ctx.arc((i + 0.5) * dx, (j + 0.5) * dy, r, 0, Math.PI * 2);
      ctx.fillStyle = (i + j) % 7 === 0 ? c[3] : c[1 + ((i * 3 + j) % 2)];
      ctx.globalAlpha = 0.35 + wave * 0.55;
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function drawMesh(ctx, W, H, c, R) {
  ctx.fillStyle = c[0]; ctx.fillRect(0, 0, W, H);
  const blobs = 4 + Math.floor(R() * 3);
  for (let i = 0; i < blobs; i++) {
    const x = R() * W, y = R() * H;
    const r = Math.min(W, H) * (0.25 + R() * 0.35);
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    const col = c[1 + (i % 3)];
    g.addColorStop(0, col); g.addColorStop(1, col + '00');
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  ctx.globalAlpha = 1;
  // grain for texture
  const img = ctx.getImageData(0, 0, W, H);
  const d = img.data;
  const grainR = rng(state.seed + 7);
  for (let i = 0; i < d.length; i += 4) {
    const n = (grainR() - 0.5) * 14;
    d[i] += n; d[i+1] += n; d[i+2] += n;
  }
  ctx.putImageData(img, 0, 0);
}

// ================= UI =================
function renderPatternGrid() {
  const grid = document.getElementById('patternGrid');
  grid.innerHTML = '';
  PATTERNS.forEach(p => {
    const b = document.createElement('button');
    b.className = 'pattern-btn' + (state.pattern === p.id ? ' active' : '');
    b.innerHTML = '<span class="p-icon">' + p.icon + '</span><span>' + (p.name[lang] || p.name.en) + '</span>';
    b.onclick = () => { state.pattern = p.id; state.seed = Math.floor(Math.random() * 1e9); renderPatternGrid(); render(); };
    grid.appendChild(b);
  });
}

function renderPaletteGrid() {
  const grid = document.getElementById('paletteGrid');
  grid.innerHTML = '';
  PALETTES.forEach((p, i) => {
    const b = document.createElement('button');
    b.className = 'palette-btn' + (state.paletteIdx === i && !state.custom ? ' active' : '');
    const cols = p[state.mode];
    b.innerHTML = '<div class="palette-sw">' + cols.map(x => '<div style="background:' + x + '"></div>').join('') + '</div>'
      + '<div class="palette-name">' + p.name + '</div>';
    b.onclick = () => { state.paletteIdx = i; state.custom = null; state.seed = Math.floor(Math.random() * 1e9); renderPaletteGrid(); render(); };
    grid.appendChild(b);
  });
}

// events
document.getElementById('modeLight').onclick = () => setMode('light');
document.getElementById('modeDark').onclick = () => setMode('dark');
function setMode(m) {
  state.mode = m;
  document.getElementById('modeLight').classList.toggle('active', m === 'light');
  document.getElementById('modeDark').classList.toggle('active', m === 'dark');
  document.documentElement.setAttribute('data-theme', m === 'dark' ? 'dark' : '');
  // keep wallpaper palette mode in sync? No — wallpaper mode is independent. Just re-render swatches.
  renderPaletteGrid(); render();
}
document.getElementById('sizeSel').onchange = e => { state.size = e.target.value; render(); };
document.getElementById('shuffleBtn').onclick = () => {
  state.seed = Math.floor(Math.random() * 1e9);
  state.paletteIdx = Math.floor(Math.random() * PALETTES.length);
  state.custom = null;
  renderPaletteGrid(); render();
};
document.getElementById('customBtn').onclick = () => {
  state.custom = [document.getElementById('c1').value, document.getElementById('c2').value, document.getElementById('c3').value, document.getElementById('c2').value];
  state.seed = Math.floor(Math.random() * 1e9);
  renderPaletteGrid(); render();
};
['c1','c2','c3'].forEach(id => {
  document.getElementById(id).oninput = () => {
    if (state.custom) {
      state.custom = [document.getElementById('c1').value, document.getElementById('c2').value, document.getElementById('c3').value, document.getElementById('c2').value];
      render();
    }
  };
});
document.getElementById('dlBtn').onclick = () => {
  const cv = document.getElementById('wp');
  const [W, H] = SIZES[state.size];
  const pName = PATTERNS.find(p => p.id === state.pattern).id;
  cv.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'wllpr-' + pName + '-' + W + 'x' + H + '.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }, 'image/png');
};
document.getElementById('themeBtn').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? '' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  document.getElementById('themeBtn').textContent = next === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('wllpr-theme', next);
};
document.getElementById('langBtn').onclick = () => {
  lang = lang === 'id' ? 'en' : 'id';
  localStorage.setItem('wllpr-lang', lang);
  applyLang(); render();
};

// init
(function init() {
  const savedTheme = localStorage.getItem('wllpr-theme') || '';
  document.documentElement.setAttribute('data-theme', savedTheme);
  document.getElementById('themeBtn').textContent = savedTheme === 'dark' ? '☀️' : '🌙';
  applyLang();
  renderPaletteGrid();
  render();
})();
</script>
</body>
</html>
